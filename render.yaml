services:
  # ---------------------------------------------------------
  # TraceLens API Service (FastAPI Backend)
  # ---------------------------------------------------------
  - type: web
    name: tracelens-api
    env: docker
    dockerfilePath: ./docker/Dockerfile
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_JSON
        value: "true"
      - key: DATABASE_URL
        value: sqlite:////srv/app/data/tracelens.db
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: LANGCHAIN_PROJECT
        value: tracelens
      - key: LANGCHAIN_TRACING_V2
        value: "false"
    disk:
      name: tracelens-data
      mountPath: /srv/app/data
      sizeGB: 1

